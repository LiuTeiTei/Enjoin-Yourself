<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8ED"/>
      <stop offset="0.55" stop-color="#F6EEE1"/>
      <stop offset="1" stop-color="#E6F0EB"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18483D"/>
      <stop offset="1" stop-color="#2F7160"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#315146" flood-opacity=".12"/>
    </filter>
    <style>
      .sans { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-weight: 700; }
      .muted { fill: #5F716B; }
      .body { fill: #263B34; font-size: 30px; }
      .small { fill: #5F716B; font-size: 24px; }
      .card { fill: #FFFDF9; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="1000" cy="105" r="260" fill="#D7E5D9" opacity=".65"/>
  <circle cx="-70" cy="1740" r="260" fill="#F3DAB6" opacity=".5"/>

  <text x="72" y="94" class="sans" font-size="27" letter-spacing="3" fill="#41685B">川西小环线 · 8日游</text>
  <text x="72" y="167" class="title" font-size="64" fill="#173E34">DAY 1</text>
  <text x="72" y="222" class="title" font-size="41" fill="#173E34">深圳 → 成都</text>
  <text x="72" y="269" class="sans" font-size="27" fill="#5B756D">8月8日 · 周六 · 抵达、采购、休整</text>
  <rect x="72" y="286" width="430" height="39" rx="19.5" fill="#F7E7D1"/>
  <text x="93" y="313" class="title" font-size="23" fill="#A65825">15:00 · 深圳宝安机场 T3 会合</text>

  <rect x="60" y="342" width="960" height="298" rx="36" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="108" y="401" class="sans" font-size="25" letter-spacing="3" fill="#B8D9C7">✈️ 航班信息</text>
  <text x="108" y="478" class="title" font-size="51" fill="#FFFFFF">深圳宝安 T3</text>
  <path d="M458 462 H622" stroke="#B7D8C6" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M595 450 l25 12 -25 12z" fill="#B7D8C6"/>
  <text x="655" y="478" class="title" font-size="51" fill="#FFFFFF">成都双流 T1</text>
  <text x="108" y="551" class="sans" font-size="32" fill="#E6F4EC">川航 3U8706　16:40 起飞 → 19:15 到达</text>
  <text x="108" y="596" class="sans" font-size="25" fill="#B8D9C7">飞行约 2小时35分钟 · 含热正餐</text>

  <rect x="60" y="662" width="960" height="212" rx="32" class="card" filter="url(#shadow)"/>
  <rect x="60" y="662" width="16" height="212" rx="8" fill="#E8914A"/>
  <text x="108" y="724" class="title" font-size="31" fill="#A65825">⛈️  天气与穿搭</text>
  <text x="108" y="782" class="body">成都雷阵雨　23–29℃　降雨概率 54%</text>
  <text x="108" y="829" class="small">短袖/薄长袖 + 轻薄防水外套；带折叠伞、穿防滑运动鞋</text>

  <text x="72" y="949" class="title" font-size="37" fill="#173E34">抵达后的安排</text>
  <line x1="72" y1="975" x2="1008" y2="975" stroke="#C9D8D0" stroke-width="2"/>
  <circle cx="97" cy="1046" r="16" fill="#2F7160"/>
  <text x="139" y="1056" class="title" font-size="31" fill="#263B34">19:15　抵达成都双流机场 T1</text>
  <text x="139" y="1098" class="small">出机场后取车，再前往双流机场附近酒店入住</text>
  <circle cx="97" cy="1175" r="16" fill="#2F7160"/>
  <text x="139" y="1185" class="title" font-size="31" fill="#263B34">晚上　完成次日高原物资采购</text>
  <text x="139" y="1227" class="small">住双流机场附近，当晚取好车，次日直接出发</text>

  <rect x="60" y="1280" width="960" height="292" rx="32" class="card" filter="url(#shadow)"/>
  <text x="108" y="1344" class="title" font-size="31" fill="#173E34">🛒 采购清单</text>
  <line x1="108" y1="1371" x2="972" y2="1371" stroke="#E1EAE4" stroke-width="2"/>
  <text x="110" y="1435" class="body">• 便携氧气瓶　每人 1–2 瓶</text>
  <text x="570" y="1435" class="body">• 矿泉水、零食</text>
  <text x="110" y="1500" class="body">• 泡面　每人 1–2 桶</text>
  <text x="570" y="1500" class="body">• 水果、巧克力</text>
  <text x="110" y="1541" class="small">氧气瓶不能带上飞机，务必在成都购买</text>

  <rect x="60" y="1620" width="960" height="196" rx="32" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="1682" class="title" font-size="31" fill="#A65825">🛁 今晚特别提醒</text>
  <text x="108" y="1735" class="body">务必好好洗澡、洗头并吹干头发。</text>
  <text x="108" y="1780" class="small">明后两天进入高海拔，8月9日、10日晚不建议洗澡洗头。</text>

  <text x="72" y="1870" class="sans" font-size="22" letter-spacing="2" fill="#668078">ENJOIN YOURSELF · 安全第一，不赶路</text>
</svg>
