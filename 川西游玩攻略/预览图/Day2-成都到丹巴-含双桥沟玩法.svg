<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="4620" viewBox="0 0 1080 4620">
  <defs>
    <linearGradient id="detailBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3EFEA"/><stop offset="0.14" stop-color="#FFF8ED"/><stop offset="1" stop-color="#E3EFEA"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#315146" flood-opacity=".11"/></filter>
    <style>
      .sans { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-weight:700; }
      .body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#263B34; font-size:27px; }
      .small { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#5F716B; font-size:22px; }
    </style>
  </defs>
  <rect width="1080" height="4620" fill="#E3EFEA"/>
  <image href="data:image/svg+xml;base64," xlink:href="data:image/svg+xml;base64," x="0" y="0" width="1080" height="1920" preserveAspectRatio="none"/>
  <rect x="0" y="1866" width="1080" height="54" fill="#F4EEE0"/>
  <rect x="60" y="1878" width="960" height="190" rx="30" fill="#F8E5E2" filter="url(#shadow)"/>
  <text x="108" y="1935" class="title" font-size="29" fill="#AD503C">🚭 高海拔抽烟提醒</text>
  <text x="108" y="1977" class="small">大雪塘、猫鼻梁、红杉林等高海拔点别抽。</text>
  <text x="108" y="2012" class="small">第一天身体未适应，抽烟容易加重头晕。</text>
  <text x="108" y="2047" class="small">到丹巴（1860m）后再正常抽。</text>
  <g transform="translate(0 160)">
  <rect x="0" y="1920" width="1080" height="2820" fill="url(#detailBg)"/>
  <rect x="60" y="1938" width="960" height="52" rx="26" fill="#2F7160"/>
  <text x="540" y="1973" text-anchor="middle" class="title" font-size="24" letter-spacing="2" fill="#FFFFFF">双桥沟景区 · 详细游玩路线（从高到低）</text>
  <text x="72" y="2060" class="title" font-size="41" fill="#173E34">双桥沟怎么玩？</text>
  <text x="72" y="2105" class="sans" font-size="26" fill="#5B756D">全长约35km，观光车单程约40分钟；先坐到最高处，再一站站往下玩。</text>
  <rect x="60" y="2145" width="960" height="84" rx="26" fill="#E5F0EA" filter="url(#shadow)"/>
  <text x="108" y="2199" class="title" font-size="25" fill="#2F7160">🚌 每站都能上下车；红杉林约17:30–18:00发出末班车，别错过。</text>

  <rect x="60" y="2265" width="960" height="195" rx="30" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2320" class="title" font-size="29" fill="#A65825">① 红杉林｜3840m · 约20分钟 · 必去</text>
  <text x="108" y="2362" class="small">🌲 终点站，雪山环抱；环形木栈道约15–20分钟。</text>
  <text x="108" y="2397" class="small">🍢 下车点有小吃：烤肠、煮玉米、烤土豆、腊肉排骨、泡面。</text>
  <text x="108" y="2432" class="small">⚠️ 海拔最高，走路放慢、不跑跳；头晕就坐下休息。</text>

  <rect x="60" y="2524" width="960" height="160" rx="30" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2579" class="title" font-size="29" fill="#2F7160">② 布达拉峰｜3700m · 车程约10分钟</text>
  <text x="108" y="2621" class="small">📸 公路 + 白塔 + 雪山同框；拍照注意来往车辆。</text>
  <text x="108" y="2656" class="small">🚶 拍完过马路到对面，沿溪木栈道去珠噶纳措。</text>

  <rect x="60" y="2749" width="960" height="230" rx="30" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2804" class="title" font-size="29" fill="#5D9EAA">③ 珠噶纳措｜无车站 · 徒步20–30分钟</text>
  <text x="108" y="2846" class="small">🥾 约800m–1km：从布达拉峰对面出发，沿溪往红杉林走。</text>
  <text x="108" y="2881" class="small">🚶 路平缓；10–15分钟到公路边，过马路走钢架栈道。</text>
  <text x="108" y="2916" class="small">🏞 再走约5分钟到湖边，密林小湖可倒映雪山。</text>
  <text x="108" y="2951" class="small">🚌 游完到“大石头”（近小木屋）招手拦车，不走回头路。</text>

  <rect x="60" y="3038" width="960" height="205" rx="30" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="3093" class="title" font-size="29" fill="#2F7160">④ 珠噶纳措 → 撵鱼坝｜坐车约15分钟</text>
  <text x="108" y="3135" class="small">🚌 大石头处拦车；漂流4.5km、15–25分钟，90元/人。</text>
  <text x="108" y="3170" class="small">🚣 水流平缓，一般不湿衣；不漂流走3.5km栈道约40分钟。</text>
  <text x="108" y="3205" class="small">🥾 终点有观光车站，直接上车下行；累了跳过徒步。</text>

  <rect x="60" y="3327" width="960" height="125" rx="30" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="3382" class="title" font-size="29" fill="#2F7160">⑤ 💧四姑娜措｜3580m · 停留15–20分钟 · 可选</text>
  <text x="108" y="3424" class="small">🪞 坐车途经；湖面平静时倒映四姑娘山，湖水因矿物质呈蓝绿色。</text>

  <rect x="60" y="3517" width="960" height="125" rx="30" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="3572" class="title" font-size="29" fill="#2F7160">⑥ 🌳隆珠措｜3490m · 停留约15分钟 · 可选</text>
  <text x="108" y="3614" class="small">🌿 看湖中枯死的沙棘树；与四姑娜措风格相近，二选一即可。</text>

  <rect x="60" y="3707" width="960" height="155" rx="30" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="3762" class="title" font-size="29" fill="#A65825">⑦ 🌿人参果坪｜3300m · 停留10–15分钟 · 可选</text>
  <text x="108" y="3804" class="small">🐂 最后一个下车点：高山草甸、牦牛吃草。</text>
  <text x="108" y="3839" class="small">⏭️ 赶时间可以跳过，直接上车出景区。</text>

  <rect x="60" y="3897" width="960" height="125" rx="30" fill="#E5F0EA" filter="url(#shadow)"/>
  <text x="108" y="3952" class="title" font-size="29" fill="#2F7160">🚌 出景区</text>
  <text x="108" y="3994" class="small">⏱️ 最后一站上车，约20分钟回大门；留意最里面发出的末班车。</text>

  <rect x="60" y="4087" width="960" height="165" rx="30" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="4145" class="title" font-size="29" fill="#A65825">⚠️ 带父母的轻松版取舍</text>
  <text x="108" y="4188" class="body">核心走：红杉林 + 布达拉峰；其余每站都按体力、天气和时间加减。</text>
  <text x="108" y="4225" class="small">高反、下雨或疲劳时，不徒步珠噶纳措、不走撵鱼坝栈道，直接坐观光车下行。</text>
  <text x="72" y="4400" class="sans" font-size="22" letter-spacing="2" fill="#668078">ENJOIN YOURSELF · 安全第一，不赶路</text>
  </g>
</svg>
