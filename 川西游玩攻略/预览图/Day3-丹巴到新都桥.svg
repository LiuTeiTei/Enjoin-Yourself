<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3855" viewBox="0 0 1080 3855">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8ED"/><stop offset="0.45" stop-color="#F4EEE0"/><stop offset="1" stop-color="#E3EFEA"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18483D"/><stop offset="1" stop-color="#2F7160"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#315146" flood-opacity=".12"/></filter>
    <style>
      .sans { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-weight:700; }
      .body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#263B34; font-size:27px; }
      .small { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#5F716B; font-size:22px; }
    </style>
  </defs>
  <rect width="1080" height="3855" fill="url(#bg)"/>
  <circle cx="1005" cy="95" r="260" fill="#D7E5D9" opacity=".65"/>
  <circle cx="-100" cy="5150" r="300" fill="#F3DAB6" opacity=".48"/>
  <text x="72" y="94" class="sans" font-size="27" letter-spacing="3" fill="#41685B">川西小环线 · 8日游</text>
  <text x="72" y="167" class="title" font-size="64" fill="#173E34">DAY 3</text>
  <text x="72" y="222" class="title" font-size="41" fill="#173E34">丹巴 → 塔公 → 新都桥</text>
  <text x="72" y="269" class="sans" font-size="27" fill="#5B756D">8月10日 · 周一 · 高原适应关键日</text>

  <rect x="60" y="318" width="960" height="330" rx="36" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="108" y="378" class="sans" font-size="25" letter-spacing="3" fill="#B8D9C7">🚗 今日自驾</text>
  <text x="108" y="440" class="title" font-size="36" fill="#FFFFFF">丹巴 → 雅拉雪山 → 墨石公园</text>
  <text x="108" y="482" class="title" font-size="36" fill="#FFFFFF">→ 塔公草原 → 新都桥</text>
  <text x="108" y="530" class="title" font-size="31" fill="#E6F4EC">约150公里 · 纯开车约3.5–4小时</text>
  <text x="108" y="570" class="sans" font-size="24" fill="#B8D9C7">海拔：丹巴1860m → 最高3700m → 新都桥3460m</text>
  <text x="108" y="612" class="sans" font-size="22" fill="#B8D9C7">多数时间在3500m以上：空气更稀薄，慢走、多喝热水、不逞强</text>

  <rect x="60" y="692" width="960" height="194" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <rect x="60" y="692" width="16" height="194" rx="8" fill="#E8914A"/>
  <text x="108" y="753" class="title" font-size="31" fill="#A65825">🌦️ 天气与穿搭</text>
  <text x="108" y="805" class="body">新都桥小雨 · 6–17℃ · 降雨概率约45%</text>
  <text x="108" y="846" class="small">长袖 + 抓绒/薄羽绒 + 防水外套；长裤、防滑鞋。高处加帽子手套。</text>

  <text x="72" y="970" class="title" font-size="39" fill="#173E34">今日时间线</text>
  <line x1="72" y1="997" x2="1008" y2="997" stroke="#C9D8D0" stroke-width="2"/>
  <circle cx="97" cy="1062" r="15" fill="#2F7160"/><text x="139" y="1072" class="title" font-size="29" fill="#263B34">09:00　从丹巴出发</text><text x="139" y="1110" class="small">沿G248向西，丹巴→八美约95km / 约2小时</text>
  <circle cx="97" cy="1171" r="15" fill="#2F7160"/><text x="139" y="1181" class="title" font-size="29" fill="#263B34">10:30　雅拉雪山观景台</text><text x="139" y="1219" class="small">拍照15–20分钟；11:30到八美午餐</text>
  <circle cx="97" cy="1280" r="15" fill="#2F7160"/><text x="139" y="1290" class="title" font-size="29" fill="#263B34">12:30　墨石公园</text><text x="139" y="1328" class="small">游玩约2小时；14:30后木雅大寺为可选项</text>
  <circle cx="97" cy="1389" r="15" fill="#2F7160"/><text x="139" y="1399" class="title" font-size="29" fill="#263B34">16:00–17:30　塔公草原</text><text x="139" y="1437" class="small">之后约30km / 40分钟到新都桥，办理入住</text>

  <rect x="60" y="1500" width="960" height="165" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="1560" class="title" font-size="30" fill="#2F7160">🏔️ 雅拉雪山观景台｜3500m · 停留15–20分钟</text>
  <text x="108" y="1605" class="small">📸 看金字塔般的雅拉雪山，山形壮观；风大，下车先穿外套。</text>
  <text x="108" y="1640" class="small">⚠️ 第一天连续高海拔活动，拍照即可，不要快走、跑跳或久站。</text>

  <g transform="translate(0 -45)">
  <rect x="60" y="1750" width="960" height="235" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="1810" class="title" font-size="30" fill="#2F7160">🪨 墨石公园｜3500m · 游玩约2小时</text>
  <text x="108" y="1855" class="small">🚌 大门坐观光车约5分钟到核心区；沿栈道走进灰色糜棱岩石林。</text>
  <text x="108" y="1890" class="small">🥾 原路返回或走环线回上车点，全程约2–2.5km，平缓、无大爬升。</text>
  <text x="108" y="1925" class="small">🍖 出口有牦牛肉干和本地特产小摊。</text>
  <text x="108" y="1960" class="small">📸 穿红/白/橙等亮色更出片，灰色石林背景下对比最明显。</text>
  </g>

  <g transform="translate(0 -135)">
  <rect x="60" y="2115" width="960" height="235" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2175" class="title" font-size="30" fill="#A65825">🛕 木雅大寺｜备选 · 游玩约1小时</text>
  <text x="108" y="2220" class="small">🚗 从墨石约20km / 30分钟；不去就直接前往塔公草原。</text>
  <text x="108" y="2255" class="small">👀 “小色达”寺庙群：看大玛尼堆、免费佛学院大殿、雅拉雪山和各日马村。</text>
  <text x="108" y="2290" class="small">📸 可拍寺院环境，但不拍佛像；进殿脱帽、脱鞋、摘墨镜。</text>
  <text x="108" y="2325" class="small">🚫 禁飞无人机；父母累了可跳过，把体力留给塔公和日落。</text>
  </g>

  <g transform="translate(0 -218)">
  <rect x="60" y="2473" width="960" height="200" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2533" class="title" font-size="30" fill="#2F7160">🌿 塔公草原｜3700m · 免费 · 16:00–17:30</text>
  <text x="108" y="2578" class="small">📸 金塔 + 雅拉雪山是经典机位；可骑马，可现场询价。</text>
  <text x="108" y="2613" class="small">🧥 风很大，体感通常比实际低5–8℃，必须穿外套。</text>
  <text x="108" y="2648" class="small">☕ 想安静可再开几分钟到姑弄村：人少，可在小溪边喝咖啡看雪山。</text>
  </g>

  <g transform="translate(0 -308)">
  <rect x="60" y="2803" width="960" height="525" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2863" class="title" font-size="31" fill="#A65825">🌅 日落怎么选？按体力和天气三选一</text>
  <text x="108" y="2913" class="title" font-size="27" fill="#2F7160">A｜新都桥贡嘎雪山观景台 · 最轻松，推荐父母</text>
  <text x="108" y="2950" class="small">免费；318国道旁，离镇近，步行10–15分钟缓坡，也可骑马。</text>
  <text x="108" y="2985" class="small">入住后步行去，看完日落约20:00–20:30回镇吃饭。</text>
  <text x="108" y="3042" class="title" font-size="27" fill="#2F7160">B｜泽仁崩增观景台 · 折中</text>
  <text x="108" y="3079" class="small">镇上开车约15分钟到山脚，可坐景区车上山。</text>
  <text x="108" y="3114" class="small">可正面看贡嘎群峰，也能远眺雅拉；比鱼子西轻松、视野更开阔。</text>
  <text x="108" y="3171" class="title" font-size="27" fill="#AD503C">C｜鱼子西 · 视野最佳，但最耗体力</text>
  <text x="108" y="3208" class="small">新都桥出发约40分钟，最后碎石路轿车慢开能走。</text>
  <text x="108" y="3243" class="small">4200m同时看雅拉+贡嘎；风大、接近0℃，厚外套+氧气瓶必备。</text>
  <text x="108" y="3300" class="small">⏭️ 不看日落：镇内或周边拍照也很美，约19:00吃晚餐。</text>
  </g>

  <g transform="translate(0 -403)">
  <rect x="60" y="3463" width="960" height="210" rx="32" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="3523" class="title" font-size="30" fill="#A65825">⚠️ 今日特别提醒</text>
  <text x="108" y="3568" class="small">G248雨季有地质灾害风险，山区行车多观察路况；全程车程虽短，也别赶。</text>
  <text x="108" y="3603" class="small">今天在3400–3700m活动，动作放缓、多喝热水；紫外线强，防晒、帽子、墨镜必备。</text>
  <text x="108" y="3638" class="small">木雅大寺和日落均为备选，当天按父母体力、天气决定；今晚不洗澡洗头。</text>
  </g>

  <g transform="translate(0 -418)">
  <rect x="60" y="3728" width="960" height="170" rx="32" fill="#F8E5E2" filter="url(#shadow)"/>
  <text x="108" y="3788" class="title" font-size="30" fill="#AD503C">🚭 高海拔抽烟提醒</text>
  <text x="108" y="3833" class="small">全天多在3500m以上，是身体适应高原的关键期，尽量少抽。</text>
  <text x="108" y="3868" class="small">新都桥3460m过夜，室外可酌情一两根，别连着抽。</text>
  </g>

  <g transform="translate(0 -455)">
  <rect x="60" y="3975" width="960" height="240" rx="32" fill="#E5F0EA" filter="url(#shadow)"/>
  <text x="108" y="4035" class="title" font-size="30" fill="#2F7160">🛏️ 今晚住宿</text>
  <text x="108" y="4080" class="body">新都桥（3460m）：务必确认酒店有供氧设备或地暖。</text>
  <text x="108" y="4117" class="small">高海拔过夜以休息为主，不建议洗澡洗头；温暖、少活动、早点睡。</text>
  <text x="108" y="4152" class="small">🫧 进房先打开供氧；不舒服先休息、及时吸氧。</text>
  <text x="108" y="4187" class="small">🚑 仍不缓解或加重：立刻说出来、去医院，千万别硬扛。</text>
  </g>
  <text x="72" y="3815" class="sans" font-size="22" letter-spacing="2" fill="#668078">ENJOIN YOURSELF · 安全第一，不赶路</text>
</svg>
