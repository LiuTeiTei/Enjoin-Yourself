<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3550" viewBox="0 0 1080 3550">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8ED"/><stop offset="0.46" stop-color="#F4EEE0"/><stop offset="1" stop-color="#E3EFEA"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18483D"/><stop offset="1" stop-color="#2F7160"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#315146" flood-opacity=".12"/></filter>
    <style>
      .sans { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-weight:700; }
      .body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#263B34; font-size:27px; }
      .small { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#5F716B; font-size:22px; }
    </style>
  </defs>
  <rect width="1080" height="3550" fill="url(#bg)"/>
  <circle cx="1010" cy="100" r="258" fill="#D7E5D9" opacity=".65"/>
  <circle cx="-90" cy="4020" r="280" fill="#F3DAB6" opacity=".48"/>
  <text x="72" y="94" class="sans" font-size="27" letter-spacing="3" fill="#41685B">川西小环线 · 8日游</text>
  <text x="72" y="167" class="title" font-size="64" fill="#173E34">DAY 4</text>
  <text x="72" y="222" class="title" font-size="41" fill="#173E34">新都桥 → 木格措 → 康定</text>
  <text x="72" y="269" class="sans" font-size="27" fill="#5B756D">8月11日 · 周二 · 最轻松的自驾日</text>

  <rect x="60" y="318" width="960" height="322" rx="36" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="108" y="378" class="sans" font-size="25" letter-spacing="3" fill="#B8D9C7">🚗 今日自驾</text>
  <text x="108" y="445" class="title" font-size="39" fill="#FFFFFF">新都桥 → 红海子 → 木格措 → 康定</text>
  <text x="108" y="507" class="title" font-size="31" fill="#E6F4EC">约120公里 · 纯开车约2.5–3小时</text>
  <text x="108" y="550" class="sans" font-size="24" fill="#B8D9C7">海拔：新都桥3460m → 红海子4200m（备选）→ 康定2600m</text>
  <text x="108" y="593" class="sans" font-size="22" fill="#B8D9C7">红海子空气最稀薄；康定下降到2600m，晚上身体会舒服很多</text>

  <rect x="60" y="684" width="960" height="195" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <rect x="60" y="684" width="16" height="195" rx="8" fill="#E8914A"/>
  <text x="108" y="746" class="title" font-size="31" fill="#A65825">☁️ 天气与穿搭</text>
  <text x="108" y="798" class="body">康定阴天 · 11–21℃ · 山区仍可能有局地阵雨</text>
  <text x="108" y="840" class="small">市区短袖/薄长袖 + 防水外套；去红海子、木格措加抓绒/薄羽绒、长裤和防水鞋。</text>

  <text x="72" y="966" class="title" font-size="39" fill="#173E34">今日时间线</text>
  <line x1="72" y1="993" x2="1008" y2="993" stroke="#C9D8D0" stroke-width="2"/>
  <circle cx="97" cy="1058" r="15" fill="#2F7160"/><text x="139" y="1068" class="title" font-size="29" fill="#263B34">09:00　新都桥出发</text><text x="139" y="1106" class="small">走434省道，约60km / 1.5小时到红海子</text>
  <circle cx="97" cy="1168" r="15" fill="#2F7160"/><text x="139" y="1178" class="title" font-size="29" fill="#263B34">10:30　红海子（备选）→ 网红机场路</text><text x="139" y="1216" class="small">红海子视状态停留；11:10机场路拍照约15分钟</text>
  <circle cx="97" cy="1278" r="15" fill="#2F7160"/><text x="139" y="1288" class="title" font-size="29" fill="#263B34">12:00　康定午餐</text><text x="139" y="1326" class="small">推荐菌王府菌汤锅，有不辣选择，适合父母补充体力</text>
  <circle cx="97" cy="1388" r="15" fill="#2F7160"/><text x="139" y="1398" class="title" font-size="29" fill="#263B34">13:30　木格措 → 17:00出景区</text><text x="139" y="1436" class="small">18:00到康定老城溜溜城附近晚餐、散步</text>

  <rect x="60" y="1500" width="960" height="245" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="1560" class="title" font-size="30" fill="#A65825">🏔️ 红海子｜4200m · 免费 · 完全看当天状态</text>
  <text x="108" y="1605" class="small">✅ 状态好：沿湖慢走拍照30–40分钟；😐 一般：车内看或停5分钟。</text>
  <text x="108" y="1640" class="small">⛔ 头晕、恶心、气短等不适：直接跳过，不勉强。</text>
  <text x="108" y="1675" class="small">🧥 体感接近0℃；下车前先穿厚外套，氧气瓶放车上随时取用。</text>
  <text x="108" y="1710" class="small">🚭 4200m坚决别抽；这是全程最高点。</text>

  <g transform="translate(0 -39)">
  <rect x="60" y="1824" width="960" height="175" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="1884" class="title" font-size="30" fill="#2F7160">✈️ 网红机场路｜3700m · 停留约15分钟</text>
  <text x="108" y="1929" class="small">📸 434省道靠近康定机场的一段：公路 + 雪山 + 飞机同框。</text>
  <text x="108" y="1964" class="small">🅿️ 路边有停车区；拍照留意往来车辆，不在车道上停留。</text>
  </g>

  <g transform="translate(0 -39)">
  <rect x="60" y="2039" width="960" height="170" rx="32" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="2099" class="title" font-size="30" fill="#A65825">🍲 康定午餐｜12:00左右</text>
  <text x="108" y="2144" class="body">推荐菌王府菌汤锅：汤底鲜、可选不辣，适合父母补充体力。</text>
  <text x="108" y="2181" class="small">午餐后出发木格措；16:30停止入园，务必下午4点前到景区。</text>
  </g>

  <g transform="translate(0 -69)">
  <rect x="60" y="2279" width="960" height="205" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2339" class="title" font-size="30" fill="#2F7160">🌊 木格措入园与交通｜2600–3780m · 游玩约3小时</text>
  <text x="108" y="2384" class="small">🎫 下午4点前入园；16:30停止入园。</text>
  <text x="108" y="2419" class="small">🚗 私家车停游客中心/停车场，核心景点必须换乘景区观光车。</text>
  <text x="108" y="2454" class="small">🚌 观光车覆盖主要站点；少走路版以短栈道拍照为主，适合带父母。</text>
  </g>

  <g transform="translate(0 -114)">
  <rect x="60" y="2569" width="960" height="285" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2629" class="title" font-size="30" fill="#2F7160">🗺️ 木格措轻松玩法｜从高处往下</text>
  <text x="108" y="2674" class="small">① 🚌 观光车约30分钟直达野人海（3780m）：蓝绿色高山湖，背靠雪山。</text>
  <text x="108" y="2709" class="small">② ♨️ 野人海旁免费温泉泡脚池，水温约40℃；强烈推荐给父母泡脚解乏。</text>
  <text x="108" y="2744" class="small">③ 🚶 沿平缓栈道下行看千瀑峡；走累随时回观光车，不必硬走全程。</text>
  <text x="108" y="2779" class="small">④ 🥚 药池沸泉站可泡脚、买温泉煮蛋尝鲜；随后坐车返程。</text>
  <text x="108" y="2814" class="small">⏱️ 以观光车 + 短距离栈道为主，通常步行约1–2km；全程大段山路不用走。</text>
  </g>

  <g transform="translate(0 -163)">
  <rect x="60" y="2943" width="960" height="210" rx="32" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="3003" class="title" font-size="30" fill="#A65825">⚠️ 今日特别提醒</text>
  <text x="108" y="3048" class="small">434省道是景观大道，雨季相对安全；仍按山区路况慢开、观察路面。</text>
  <text x="108" y="3083" class="small">红海子状态不好立即跳过；木格措下午4点前入园，避免赶末班观光车。</text>
  <text x="108" y="3118" class="small">康定海拔2600m，今晚可以放心洗热水澡、洗头，好好恢复。</text>
  </g>

  <g transform="translate(0 -163)">
  <rect x="60" y="3193" width="960" height="190" rx="32" fill="#F8E5E2" filter="url(#shadow)"/>
  <text x="108" y="3253" class="title" font-size="30" fill="#AD503C">🚭 抽烟提醒</text>
  <text x="108" y="3298" class="small">红海子4200m是全程最高点，坚决别抽；机场路和木格措高处也尽量别抽。</text>
  <text x="108" y="3333" class="small">到康定（2600m）后可正常，但仍以休息、补水为先。</text>
  </g>

  <g transform="translate(0 -163)">
  <rect x="60" y="3423" width="960" height="195" rx="32" fill="#E5F0EA" filter="url(#shadow)"/>
  <text x="108" y="3483" class="title" font-size="30" fill="#2F7160">🛏️ 今晚住康定｜2600m</text>
  <text x="108" y="3528" class="body">入住后好好洗热水澡、洗头；晚餐可选溜溜城附近，饭后散步看夜景。</text>
  <text x="108" y="3565" class="small">相比新都桥含氧量更充足，今晚重点是放松、补水、早点休息。</text>
  </g>
  <text x="72" y="3510" class="sans" font-size="22" letter-spacing="2" fill="#668078">ENJOIN YOURSELF · 安全第一，不赶路</text>
</svg>
