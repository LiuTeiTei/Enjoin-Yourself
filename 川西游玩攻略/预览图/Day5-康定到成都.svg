<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2850" viewBox="0 0 1080 2850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8ED"/><stop offset="0.48" stop-color="#F4EEE0"/><stop offset="1" stop-color="#E3EFEA"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18483D"/><stop offset="1" stop-color="#2F7160"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#315146" flood-opacity=".12"/></filter>
    <style>
      .sans { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-weight:700; }
      .body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#263B34; font-size:27px; }
      .small { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#5F716B; font-size:22px; }
    </style>
  </defs>
  <rect width="1080" height="2850" fill="url(#bg)"/>
  <circle cx="1005" cy="95" r="260" fill="#D7E5D9" opacity=".65"/>
  <circle cx="-100" cy="3500" r="280" fill="#F3DAB6" opacity=".48"/>
  <text x="72" y="94" class="sans" font-size="27" letter-spacing="3" fill="#41685B">川西小环线 · 8日游</text>
  <text x="72" y="167" class="title" font-size="64" fill="#173E34">DAY 5</text>
  <text x="72" y="222" class="title" font-size="41" fill="#173E34">康定 → 都江堰 → 成都</text>
  <text x="72" y="269" class="sans" font-size="27" fill="#5B756D">8月12日 · 周三 · 回到低海拔休整</text>

  <rect x="60" y="318" width="960" height="315" rx="36" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="108" y="378" class="sans" font-size="25" letter-spacing="3" fill="#B8D9C7">🚗 今日自驾</text>
  <text x="108" y="445" class="title" font-size="40" fill="#FFFFFF">康定 → 都江堰 → 成都东站</text>
  <text x="108" y="507" class="title" font-size="31" fill="#E6F4EC">约280公里 · 纯开车约4.5–6小时</text>
  <text x="108" y="550" class="sans" font-size="24" fill="#B8D9C7">海拔：康定2600m → 都江堰800m → 成都约500m</text>
  <text x="108" y="592" class="sans" font-size="22" fill="#B8D9C7">一路下山，含氧量会明显变好；但隧道多、车程长，更要防疲劳</text>

  <rect x="60" y="677" width="960" height="188" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <rect x="60" y="677" width="16" height="188" rx="8" fill="#E8914A"/>
  <text x="108" y="738" class="title" font-size="31" fill="#A65825">☁️ 天气与换装</text>
  <text x="108" y="790" class="body">成都阴到多云 · 26–34℃ · 降水概率约39%</text>
  <text x="108" y="831" class="small">康定出发仍备防水外套；到低海拔后换短袖、透气长裤和运动鞋，雨具随手放。</text>

  <text x="72" y="952" class="title" font-size="39" fill="#173E34">今日时间线</text>
  <line x1="72" y1="979" x2="1008" y2="979" stroke="#C9D8D0" stroke-width="2"/>
  <circle cx="97" cy="1045" r="15" fill="#2F7160"/><text x="139" y="1055" class="title" font-size="29" fill="#263B34">09:00　康定出发</text><text x="139" y="1093" class="small">雅叶高速返程，康定→都江堰约230km / 4.5–6小时</text>
  <circle cx="97" cy="1155" r="15" fill="#2F7160"/><text x="139" y="1165" class="title" font-size="29" fill="#263B34">12:30–13:00　都江堰午餐</text><text x="139" y="1203" class="small">已降至800m，体感明显变热，换夏装</text>
  <circle cx="97" cy="1265" r="15" fill="#2F7160"/><text x="139" y="1275" class="title" font-size="29" fill="#263B34">13:30　熊猫谷 / 直接去酒店</text><text x="139" y="1313" class="small">按父母体力二选一；都江堰→成都东站约70km / 1–1.5小时</text>
  <circle cx="97" cy="1375" r="15" fill="#2F7160"/><text x="139" y="1385" class="title" font-size="29" fill="#263B34">17:00–17:30　成都东站附近入住、还车</text><text x="139" y="1423" class="small">晚上按体力喝茶、逛街或直接休息</text>

  <rect x="60" y="1485" width="960" height="222" rx="32" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="1545" class="title" font-size="30" fill="#A65825">🛣️ 长途驾驶提醒</text>
  <text x="108" y="1590" class="small">单人开车：隧道多、明暗变化快；每1.5–2小时进服务区休息。</text>
  <text x="108" y="1625" class="small">周末下午易堵车，尽量上午早点出发；不要为了赶时间疲劳驾驶。</text>
  <text x="108" y="1660" class="small">回到低海拔后高反基本解除，今晚可好好洗澡、洗头、休息。</text>

  <rect x="60" y="1747" width="960" height="270" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="1807" class="title" font-size="30" fill="#2F7160">🐼 熊猫谷｜体力还行时的主计划</text>
  <text x="108" y="1852" class="small">🚗 都江堰午餐后开车约15–20分钟到园区；游玩约2–2.5小时。</text>
  <text x="108" y="1887" class="small">① 🐼 大熊猫别墅区：看圈养大熊猫，环境清幽、人相对少。</text>
  <text x="108" y="1922" class="small">② 🦊 小熊猫生态放养区：可能在步道边活动，禁止触摸、投喂。</text>
  <text x="108" y="1957" class="small">🚶 原路回出口，约2小时平缓步道；比成都大熊猫基地更适合带父母。</text>
  <text x="108" y="1992" class="small">😴 父母累了：跳过熊猫谷，直接去成都东站酒店休息。</text>

  <g transform="translate(0 -32)">
  <rect x="60" y="2089" width="960" height="200" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2149" class="title" font-size="30" fill="#2F7160">🚗 还车安排｜成都东站附近</text>
  <text x="108" y="2194" class="small">确认租车支持异地还车；还车前加满油、拍照留底。</text>
  <text x="108" y="2229" class="small">还完车后步行或打车起步价回酒店，订房优先选东站500m–1km内、有电梯和空调。</text>
  <text x="108" y="2264" class="small">这样 Day 6 早上走路或起步价打车就到高铁站，完全不用赶。</text>
  </g>

  <g transform="translate(0 -62)">
  <rect x="60" y="2359" width="960" height="235" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="2419" class="title" font-size="30" fill="#A65825">🌙 晚上怎么安排？按状态选</text>
  <text x="108" y="2464" class="small">🙂 状态还行：地铁2号线去人民公园鹤鸣茶社喝茶，晚上奎星楼街吃饭。</text>
  <text x="108" y="2499" class="small">😴 状态一般：酒店附近吃饭，早点休息。</text>
  <text x="108" y="2534" class="small">✨ 状态不错：去春熙路 / 太古里逛逛，地铁约20分钟。</text>
  <text x="108" y="2569" class="small">🛏️ 无论怎么安排，今晚住成都东站附近，明早不赶时间。</text>
  </g>

  <g transform="translate(0 -113)">
  <rect x="60" y="2685" width="960" height="170" rx="32" fill="#E5F0EA" filter="url(#shadow)"/>
  <text x="108" y="2745" class="title" font-size="30" fill="#2F7160">✅ 今日特别提醒</text>
  <text x="108" y="2790" class="small">路上温差大：康定约15℃、都江堰可到30℃左右，及时换夏装，别捂出汗。</text>
  <text x="108" y="2825" class="small">重点是安全下山和恢复体力；吃好、洗好、睡好，为明天早班高铁做准备。</text>
  </g>
  <text x="72" y="2805" class="sans" font-size="22" letter-spacing="2" fill="#668078">ENJOIN YOURSELF · 安全第一，不赶路</text>
</svg>
