<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3060" viewBox="0 0 1080 3060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8ED"/><stop offset="0.47" stop-color="#F4EEE0"/><stop offset="1" stop-color="#E3EFEA"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18483D"/><stop offset="1" stop-color="#2F7160"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#315146" flood-opacity=".12"/></filter>
    <style>
      .sans { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-weight:700; }
      .body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#263B34; font-size:27px; }
      .small { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#5F716B; font-size:22px; }
    </style>
  </defs>
  <rect width="1080" height="3060" fill="url(#bg)"/>
  <circle cx="1005" cy="100" r="258" fill="#D7E5D9" opacity=".65"/>
  <circle cx="-100" cy="3980" r="280" fill="#F3DAB6" opacity=".48"/>
  <text x="72" y="94" class="sans" font-size="27" letter-spacing="3" fill="#41685B">川西小环线 · 8日游</text>
  <text x="72" y="167" class="title" font-size="64" fill="#173E34">DAY 6</text>
  <text x="72" y="222" class="title" font-size="41" fill="#173E34">成都 → 黄龙 → 九寨沟</text>
  <text x="72" y="269" class="sans" font-size="27" fill="#5B756D">8月13日 · 周四 · 高铁 + 景区直通车</text>

  <rect x="60" y="318" width="960" height="270" rx="32" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="108" y="368" class="sans" font-size="23" letter-spacing="3" fill="#B8D9C7">🚄 高铁信息</text>
  <text x="108" y="443" class="sans" font-size="38" font-weight="700" fill="#FFFFFF">成都东</text>
  <path d="M382 427 H542" stroke="#B7D8C6" stroke-width="3" stroke-dasharray="10 10"/><path d="M514 415 l25 12 -25 12z" fill="#B7D8C6"/>
  <text x="575" y="443" class="sans" font-size="38" font-weight="700" fill="#FFFFFF">黄龙九寨站</text>
  <text x="108" y="503" class="sans" font-size="26" fill="#E6F4EC">C6362　08:12 发车 → 10:07 到达</text>
  <text x="108" y="541" class="sans" font-size="23" fill="#B8D9C7">全程约 1小时55分钟 · 出站后换乘景区直通车</text>

  <rect x="60" y="613" width="960" height="255" rx="32" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="108" y="663" class="sans" font-size="23" letter-spacing="3" fill="#B8D9C7">🚌 景区接驳车</text>
  <text x="108" y="738" class="sans" font-size="36" font-weight="700" fill="#FFFFFF">黄龙九寨站</text>
  <path d="M382 722 H542" stroke="#B7D8C6" stroke-width="3" stroke-dasharray="10 10"/><path d="M514 710 l25 12 -25 12z" fill="#B7D8C6"/>
  <text x="575" y="738" class="sans" font-size="36" font-weight="700" fill="#FFFFFF">九寨沟沟口</text>
  <text x="108" y="790" class="sans" font-size="24" fill="#E6F4EC">先到黄龙景区：约 26km / 35分钟；游玩后再坐车去沟口</text>
  <text x="108" y="825" class="sans" font-size="23" fill="#B8D9C7">黄龙 → 沟口：约 90km / 约 2小时 · 两段接驳共约 2小时35分钟</text>

  <rect x="60" y="898" width="960" height="195" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <rect x="60" y="898" width="16" height="195" rx="8" fill="#E8914A"/>
  <text x="108" y="960" class="title" font-size="31" fill="#A65825">🌦️ 天气与穿搭</text>
  <text x="108" y="1012" class="body">黄龙小雨 · 4–17℃ · 降雨概率约62%</text>
  <text x="108" y="1054" class="small">速干内层 + 抓绒/薄羽绒 + 防水冲锋衣；长裤、防水鞋、保暖帽和手套。</text>

  <g transform="translate(0 205)">
  <text x="72" y="956" class="title" font-size="39" fill="#173E34">今日时间线</text>
  <line x1="72" y1="983" x2="1008" y2="983" stroke="#C9D8D0" stroke-width="2"/>
  <circle cx="97" cy="1048" r="15" fill="#2F7160"/><text x="139" y="1058" class="title" font-size="29" fill="#263B34">06:30　起床、早餐、退房</text><text x="139" y="1096" class="small">住东站附近，07:20–07:40步行或起步价打车到车站</text>
  <circle cx="97" cy="1158" r="15" fill="#2F7160"/><text x="139" y="1168" class="title" font-size="29" fill="#263B34">08:12　C6362 高铁出发</text><text x="139" y="1206" class="small">10:07到黄龙九寨站（约3000m），出站换乘直通车</text>
  <circle cx="97" cy="1268" r="15" fill="#2F7160"/><text x="139" y="1278" class="title" font-size="29" fill="#263B34">11:00　抵达黄龙景区</text><text x="139" y="1316" class="small">站→景区约26km / 35分钟；黄龙游玩约3–4小时</text>
  <circle cx="97" cy="1378" r="15" fill="#2F7160"/><text x="139" y="1388" class="title" font-size="29" fill="#263B34">15:30–16:00　前往九寨沟沟口</text><text x="139" y="1426" class="small">约90km / 2小时；17:30–18:00入住，18:30采购明日午餐</text>

  <rect x="60" y="1490" width="960" height="188" rx="32" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="1550" class="title" font-size="30" fill="#A65825">🎫 出发前确认</text>
  <text x="108" y="1595" class="small">提前确认：高铁票、黄龙门票、黄龙观光车票（限量）和两段直通车。</text>
  <text x="108" y="1630" class="small">高铁 + 直通车不自驾，是雨季更省心的方案；换乘时看准“九旅悦行”班次。</text>

  <rect x="60" y="1718" width="960" height="320" rx="32" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="108" y="1778" class="title" font-size="30" fill="#2F7160">🏔️ 黄龙怎么玩｜带父母少走路版</text>
  <text x="108" y="1823" class="small">① 🚠 索道上山约8分钟；出索道后优先坐观光车到五彩池附近，少走约30分钟。</text>
  <text x="108" y="1858" class="small">② 🟡 五彩池：从观光车终点步行约600–700m，顺时针游览；旁边是黄龙古寺。</text>
  <text x="108" y="1893" class="small">③ 🚠 父母推荐原路坐下行索道，核心区约2小时即可；下行索道17:30关闭。</text>
  <text x="108" y="1928" class="small">④ 🥾 体力很好才徒步下山约2–2.5小时，依次看争艳池、金沙铺地、明镜倒映池等。</text>
  <text x="108" y="1963" class="small">🫧 景区有免费吸氧点（自备吸管），也备好便携氧气瓶；走路慢、随时休息。</text>
  <text x="108" y="1998" class="small">⚠️ 黄龙下雨体感可能接近0℃，冲锋衣或薄羽绒必须穿。</text>

  <g transform="translate(0 -65)">
  <rect x="60" y="2143" width="960" height="170" rx="32" fill="#F8E5E2" filter="url(#shadow)"/>
  <text x="108" y="2203" class="title" font-size="30" fill="#AD503C">🚭 黄龙抽烟提醒</text>
  <text x="108" y="2248" class="small">3100–3576m全程徒步：走着别抽，停下来休息时再抽。</text>
  <text x="108" y="2283" class="small">景区禁烟区域务必遵守；到九寨沟沟口（2000m）后可正常。</text>
  </g>

  <g transform="translate(0 -85)">
  <rect x="60" y="2373" width="960" height="200" rx="32" fill="#E5F0EA" filter="url(#shadow)"/>
  <text x="108" y="2433" class="title" font-size="30" fill="#2F7160">🛍️ 到九寨沟沟口后</text>
  <text x="108" y="2478" class="small">入住后在沟口商业街晚餐；采购明天景区午餐：泡面、面包、水。</text>
  <text x="108" y="2513" class="small">今晚不洗澡洗头，让身体适应；早点休息，明天全天在九寨沟景区游玩。</text>
  <text x="108" y="2548" class="small">沟口海拔2000m，住宿以温暖、安静、离景区入口近为优先。</text>
  </g>

  <g transform="translate(0 -100)">
  <rect x="60" y="2628" width="960" height="205" rx="32" fill="#FFF0DF" filter="url(#shadow)"/>
  <text x="108" y="2688" class="title" font-size="30" fill="#A65825">⚠️ 今日特别提醒</text>
  <text x="108" y="2733" class="small">黄龙高海拔、雨天又冷：不舒服就停下来休息、及时吸氧，别硬走。</text>
  <text x="108" y="2768" class="small">直通车时间按现场班次为准；出景区后尽快上车，避免错过前往沟口的班车。</text>
  <text x="108" y="2803" class="small">今天交通环节多，但全程不用开车，重点是保暖、慢走、看好换乘。</text>
  </g>
  <text x="72" y="2795" class="sans" font-size="22" letter-spacing="2" fill="#668078">ENJOIN YOURSELF · 安全第一，不赶路</text>
  </g>
</svg>
