<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3300" viewBox="0 0 1080 3300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F4F7F7"/><stop offset=".52" stop-color="#F9F7F1"/><stop offset="1" stop-color="#EEF3F1"/></linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A53C34"/><stop offset="1" stop-color="#D35C4E"/></linearGradient>
    <filter id="shadow" x="-12%" y="-10%" width="124%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B4C50" flood-opacity=".13"/></filter>
    <style>
      .sans{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}.eyebrow{font:700 22px "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:3px;fill:#5A7476}.hero{font:800 52px "PingFang SC","Microsoft YaHei",sans-serif;fill:#183C40}.sub{font:400 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5C7474}.section{font:800 35px "PingFang SC","Microsoft YaHei",sans-serif;fill:#193F42}.cardtitle{font:700 30px "PingFang SC","Microsoft YaHei",sans-serif;fill:#24484A}.body{font:400 25px "PingFang SC","Microsoft YaHei",sans-serif;fill:#516B6C}.strong{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#263F41}.tiny{font:400 22px "PingFang SC","Microsoft YaHei",sans-serif;fill:#617879}.footer{font:400 22px "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:2px;fill:#6A8180}
    </style>
  </defs>
  <rect width="1080" height="3300" fill="url(#bg)"/>
  <circle cx="980" cy="-20" r="260" fill="#D9E9E7" opacity=".75"/><circle cx="-95" cy="1880" r="250" fill="#F2DFC2" opacity=".48"/>

  <text x="72" y="88" class="eyebrow">川西小环线 · 全程通用安全手册</text>
  <text x="72" y="164" class="hero">高反安全指南</text>
  <text x="72" y="213" class="sub">记住这一句：不舒服就说，停下来比硬撑更重要。</text>

  <rect x="60" y="258" width="960" height="160" rx="34" fill="url(#alert)" filter="url(#shadow)"/>
  <text x="108" y="322" class="sans" font-size="27" font-weight="700" letter-spacing="2" fill="#FFE5DD">🚨 紧急优先级</text>
  <text x="108" y="375" class="sans" font-size="34" font-weight="700" fill="#FFFFFF">呼吸困难、意识异常、嘴唇发紫/发白 → 立刻下撤并就医</text>

  <text x="72" y="500" class="section">海拔越高，越要慢下来</text>
  <text x="72" y="542" class="sub">海拔不是数字游戏：空气更稀薄，走路、洗澡、吃太饱都会更费氧。</text>
  <rect x="60" y="580" width="960" height="665" rx="32" fill="#FFFDFC" filter="url(#shadow)"/>
  <rect x="60" y="580" width="18" height="665" rx="9" fill="#557D81"/>
  <rect x="92" y="615" width="88" height="64" rx="20" fill="#DDF0E8"/><text x="136" y="657" class="sans" font-size="25" font-weight="700" text-anchor="middle" fill="#28735E">低</text>
  <text x="212" y="655" class="strong">2000–2500m｜康定、九寨沟沟口</text><text x="212" y="693" class="body">基本无反应，可正常休息、洗澡。</text>
  <line x1="92" y1="720" x2="988" y2="720" stroke="#E4ECE8" stroke-width="2"/>
  <rect x="92" y="744" width="88" height="64" rx="20" fill="#EAF0D4"/><text x="136" y="786" class="sans" font-size="25" font-weight="700" text-anchor="middle" fill="#6B7D29">中低</text>
  <text x="212" y="784" class="strong">2500–3000m｜黄龙九寨站、松潘</text><text x="212" y="822" class="body">可能轻微头痛，建议不洗澡。</text>
  <line x1="92" y1="849" x2="988" y2="849" stroke="#E4ECE8" stroke-width="2"/>
  <rect x="92" y="873" width="88" height="64" rx="20" fill="#FFF0C9"/><text x="136" y="915" class="sans" font-size="25" font-weight="700" text-anchor="middle" fill="#A66A0B">中</text>
  <text x="212" y="913" class="strong">3000–3500m｜黄龙、四姑娘山镇、双桥沟大部分</text><text x="212" y="951" class="body">走路放慢，不跑跳，多喝热水。</text>
  <line x1="92" y1="978" x2="988" y2="978" stroke="#E4ECE8" stroke-width="2"/>
  <rect x="92" y="1002" width="88" height="64" rx="20" fill="#FFE0B3"/><text x="136" y="1044" class="sans" font-size="25" font-weight="700" text-anchor="middle" fill="#A65B19">中高</text>
  <text x="212" y="1042" class="strong">3500–4000m｜红杉林3840m、塔公草原3700m</text><text x="212" y="1080" class="body">严格限制活动，随时观察身体状态。</text>
  <line x1="92" y1="1107" x2="988" y2="1107" stroke="#E4ECE8" stroke-width="2"/>
  <rect x="92" y="1131" width="88" height="64" rx="20" fill="#F9D5D1"/><text x="136" y="1173" class="sans" font-size="25" font-weight="700" text-anchor="middle" fill="#A53C34">高</text>
  <text x="212" y="1171" class="strong">4000m以上｜红海子、鱼子西（均为备选）</text><text x="212" y="1209" class="body">停留不超1小时；状态不好直接跳过。</text>

  <text x="72" y="1312" class="section">高原三条铁律</text>
  <rect x="60" y="1352" width="960" height="172" rx="30" fill="#E7F0ED" filter="url(#shadow)"/>
  <circle cx="118" cy="1418" r="29" fill="#2F7160"/><text x="118" y="1428" class="sans" font-size="27" text-anchor="middle" fill="#FFF">1</text>
  <text x="170" y="1417" class="cardtitle">🛁 前两天不洗澡</text><text x="170" y="1460" class="body">Day 2 丹巴、Day 3 新都桥都不洗；Day 4 到康定后可正常洗。</text><text x="170" y="1498" class="tiny">热水澡会增加身体负担，可能诱发或加重高反。</text>
  <rect x="60" y="1552" width="960" height="172" rx="30" fill="#FFF8E9" filter="url(#shadow)"/>
  <circle cx="118" cy="1618" r="29" fill="#D99130"/><text x="118" y="1628" class="sans" font-size="27" text-anchor="middle" fill="#FFF">2</text>
  <text x="170" y="1617" class="cardtitle">🚶 走路放慢</text><text x="170" y="1660" class="body">像散步一样；上坡尤其慢，宁可多停几次，也不要逞强赶路。</text><text x="170" y="1698" class="tiny">高海拔走路速度比平时慢一半以上是正常的。</text>
  <rect x="60" y="1752" width="960" height="172" rx="30" fill="#EAF1F8" filter="url(#shadow)"/>
  <circle cx="118" cy="1818" r="29" fill="#4D7EAA"/><text x="118" y="1828" class="sans" font-size="27" text-anchor="middle" fill="#FFF">3</text>
  <text x="170" y="1817" class="cardtitle">☕ 多喝热水，七分饱</text><text x="170" y="1860" class="body">每天2–3升，小口多次；每餐七分饱，不要吃太撑。</text><text x="170" y="1898" class="tiny">吃太饱会增加耗氧量；保温杯随身带着。</text>

  <text x="72" y="2022" class="section">出现症状，按这个做</text>
  <text x="72" y="2064" class="sub">从上往下代表更严重：只要症状加重，就升级处理。</text>
  <rect x="60" y="2102" width="960" height="210" rx="30" fill="#FFF8DF" filter="url(#shadow)"/>
  <rect x="60" y="2102" width="18" height="210" rx="9" fill="#D99130"/>
  <text x="108" y="2160" class="cardtitle">🟡 轻度｜正常现象，先休息</text>
  <text x="108" y="2204" class="body">轻微头痛、头晕、犯困、食欲下降、失眠。</text>
  <text x="108" y="2246" class="strong">→ 停下来休息，喝热水或葡萄糖水，吸几口氧气。</text>
  <text x="108" y="2284" class="tiny">不用害怕，但不要继续逞强走路。</text>
  <rect x="60" y="2342" width="960" height="250" rx="30" fill="#FFF0DF" filter="url(#shadow)"/>
  <rect x="60" y="2342" width="18" height="250" rx="9" fill="#D56D32"/>
  <text x="108" y="2400" class="cardtitle">🟠 中度｜需要重视，停止当天活动</text>
  <text x="108" y="2444" class="body">剧烈头痛、恶心呕吐、明显乏力、走路不稳。</text>
  <text x="108" y="2486" class="strong">→ 立刻停止活动，回低海拔、吸氧，观察 1–2小时。</text>
  <text x="108" y="2528" class="tiny">休息1小时仍不缓解：放弃当天后续景点，直接下撤。</text>
  <rect x="60" y="2622" width="960" height="282" rx="30" fill="#FBE4E1" filter="url(#shadow)"/>
  <rect x="60" y="2622" width="18" height="282" rx="9" fill="#B94238"/>
  <text x="108" y="2680" class="cardtitle" fill="#9F342E">🔴 重度｜立刻就医，不要等待</text>
  <text x="108" y="2724" class="body">呼吸困难、嘴唇发紫/发白、意识模糊、咳粉红色泡沫痰。</text>
  <text x="108" y="2766" class="strong">→ 立刻下撤到 3000m 以下，直接送医院。</text>
  <text x="108" y="2808" class="tiny">沿线医院：康定市人民医院、九寨沟县人民医院。</text>
  <text x="108" y="2850" class="tiny">⚠️ 不是“忍一忍就好”的情况，必须第一时间告诉家人。</text>

  <rect x="60" y="2944" width="960" height="210" rx="32" fill="#2D6062" filter="url(#shadow)"/>
  <text x="108" y="3005" class="sans" font-size="30" font-weight="700" fill="#FFFFFF">👨‍👩‍👧 给父母的简单记法</text>
  <text x="108" y="3052" class="sans" font-size="25" fill="#E1F0E9">不洗澡 · 慢慢走 · 多喝热水 · 七分饱 · 头痛就吸氧</text>
  <text x="108" y="3100" class="sans" font-size="30" font-weight="700" fill="#FFE6BF">最重要：不舒服就说，千万不要硬扛。</text>
  <text x="72" y="3245" class="footer">ENJOIN YOURSELF · 安全第一，身体永远排在行程前面</text>
</svg>
